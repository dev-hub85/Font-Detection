<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" role="img" aria-label="Font detection pipeline: prepare data, train, validate"><title>Font detection pipeline: prepare data, train, validate</title><style>
