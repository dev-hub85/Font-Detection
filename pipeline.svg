0" y="252" width="230" height="130" rx="8" fill="#e7f5ec" stroke="#2f8f5b" stroke-width="1.6"/><text x="905.0" y="294.0" class="t" text-anchor="middle">font_index.npz</text><text x="905.0" y="313.0" class="s" text-anchor="middle">8,600 prototypes × 256</text><text x="905.0" y="331.0" class="s" text-anchor="middle">used by predict()</text><text x="905.0" y="349.0" class="s" text-anchor="middle">and the 'proto' method</text><path d="M250,317 L288,317" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><path d="M510,317 L548,317" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><path d="M750,317 L788,317" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><text x="20" y="452" class="h" text-anchor="start">3 · VALIDATE  (Google Colab)</text><rect x="20" y="472" width="270" height="130" rx="8" fill="#e8f1fb" stroke="#3d7cc9" stroke-width="1.6"/><text x="155.0" y="514.0" class="t" text-anchor="middle">val shards</text><text x="155.0" y="533.0" class="s" text-anchor="middle">fontdataset/  (mixed effects)</text><text x="155.0" y="551.0" class="s" text-anchor="middle">fontdataset_val_clean/</text><text x="155.0" y="569.0" class="s" text-anchor="middle">(generate_dataset.py --clean-val)</text><rect x="340" y="472" width="260" height="130" rx="8" fill="#ffffff" stroke="#323f4b" stroke-width="1.6"/><text x="470.0" y="514.0" class="t" text-anchor="middle">predict_colab.ipynb</text><text x="470.0" y="533.0" class="s" text-anchor="middle">top-10 fonts per val image</text><text x="470.0" y="551.0" class="s" text-anchor="middle">methods: head + proto</text><text x="470.0" y="569.0" class="s" text-anchor="middle">top-10 report, then top-5</text><rect x="650" y="472" width="370" height="130" rx="8" fill="#e7f5ec" stroke="#2f8f5b" stroke-width="1.6"/><text x="835.0" y="514.0" class="t" text-anchor="middle">runs/font_arcface/eval/&lt;val folder&gt;/</text><text x="835.0" y="533.0" class="s" text-anchor="middle">accuracy · precision · recall · F1</text><text x="835.0" y="551.0" class="s" text-anchor="middle">per-font / per-char / confusion CSVs</text><text x="835.0" y="569.0" class="s" text-anchor="middle">summary.csv · per-image top-10 CSV</text><path d="M290,537 L338,537" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><path d="M600,537 L648,537" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><path d="M400,382 L400,470" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><text x="408" y="430" class="l" text-anchor="start">best.pt</text><path d="M905,382 L905,432 L560,432 L560,470" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><text x="568" y="452" class="l" text-anchor="start">font_index.npz</text><rect x="20" y="629" width="14" height="14" rx="3" fill="#e8f1fb" stroke="#3d7cc9" stroke-width="1.4"/><text x="40" y="640" class="s" text-anchor="start">data / files</text><rect x="136.4" y="629" width="14" height="14" rx="3" fill="#ffffff" stroke="#323f4b" stroke-width="1.4"/><text x="156.4" y="640" class="s" text-anchor="start">script / notebook step</text><rect x="324.8" y="629" width="14" height="14" rx="3" fill="#e7f5ec" stroke="#2f8f5b" stroke-width="1.4"/><text x="344.8" y="640" class="s" text-anchor="start">saved output</text></svg>