<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1180" viewBox="0 0 1040 1180" role="img" aria-label="How train_colab.ipynb trains one batch of shards"><title>How train_colab.ipynb trains one batch of shards</title><style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2933}
.t{font-size:15px;font-weight:600}
.s{font-size:12.5px;fill:#3e4c59}
.m{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#1f2933}
.h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#616e7c}
.l{font-size:12px;fill:#52606d;font-style:italic}
.dim{font-family:Consolas,Menlo,monospace;font-size:12.5px;fill:#7b5cc4;font-weight:600}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs><rect width="1040" height="1180" fill="#ffffff"/><text x="300" y="36" class="h" text-anchor="start">train_batch(args)  —  ONE RUN PER BATCH OF ~30 TRAIN SHARDS</text><rect x="790" y="52" width="230" height="112" rx="8" fill="#e8f1fb" stroke="#3d7cc9" stroke-width="1.6"/><text x="905.0" y="85.0" class="t" text-anchor="middle">Drive: fontdataset/</text><text x="905.0" y="104.0" class="s" text-anchor="middle">this batch: ~30 train shards</text><text x="905.0" y="122.0" class="s" text-anchor="middle">always: val-p*, ref-p*,</text><text x="905.0" y="140.0" class="s" text-anchor="middle">fonts.csv</text><rect x="300" y="56" width="440" height="56" rx="8" fill="#ffffff" stroke="#323f4b" stroke-width="1.6"/><text x="520.0" y="79.0" class="t" text-anchor="middle">Run notebook cell 11</text><text x="520.0" y="98.0" class="s" text-anchor="middle">train_batch(args) on the train shards currently on Drive</text><path d="M790,84 L742,84" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><path d="M520.0,112 L520.0,136" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="300" y="138" width="440" height="72" rx="8" fill="#ffffff" stroke="#323f4b" stroke-width="1.6"/><text x="520.0" y="160.0" class="t" text-anchor="middle">Resume</text><text x="520.0" y="179.0" class="s" text-anchor="middle">start from last.pt = best weights of the previous batch</text><text x="520.0" y="197.0" class="s" text-anchor="middle">grow ArcFace rows if fonts.csv grew · continue mid-epoch</text><path d="M520.0,210 L520.0,234" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="300" y="236" width="440" height="72" rx="8" fill="#ffffff" stroke="#323f4b" stroke-width="1.6"/><text x="520.0" y="258.0" class="t" text-anchor="middle">Learning-rate plan</text><text x="520.0" y="277.0" class="s" text-anchor="middle">first batch: 2e-3, 5% warm-up · later batches: 1e-3, 2% warm-up</text><text x="520.0" y="295.0" class="s" text-anchor="middle">cosine decay to 1% over 10 epochs · × 0.3 after each LR cut</text><path d="M520.0,308 L520.0,352" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="200" y="332" width="640" height="500" rx="12" fill="#fafbfc" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="7 5"/><text x="216" y="352" class="h" text-anchor="start">FOR EACH EPOCH  (max_epochs = 10)</text><rect x="300" y="368" width="440" height="72" rx="8" fill="#e8f1fb" stroke="#3d7cc9" stroke-width="1.6"/><text x="520.0" y="390.0" class="t" text-anchor="middle">Stream data  (ShardStream)</text><text x="520.0" y="409.0" class="s" text-anchor="middle">2 workers × 16 shards in RAM · shuffled across shards</text><text x="520.0" y="427.0" class="s" text-anchor="middle">50% of images shifted ±2 px · batch 512</text><path d="M520.0,440 L520.0,462" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="300" y="464" width="440" height="72" rx="8" fill="#f1ecfb" stroke="#7b5cc4" stroke-width="1.6"/><text x="520.0" y="486.0" class="t" text-anchor="middle">Training step  × steps per epoch</text><text x="520.0" y="505.0" class="s" text-anchor="middle">fp16 forward → embedding → ArcFace loss → AdamW (wd 5e-4)</text><text x="520.0" y="523.0" class="s" text-anchor="middle">grad-clip 5 · last.pt saved every 50 steps</text><path d="M520.0,536 L520.0,558" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="300" y="560" width="440" height="52" rx="8" fill="#ffffff" stroke="#323f4b" stroke-width="1.6"/><text x="520.0" y="581.0" class="t" text-anchor="middle">Evaluate</text><text x="520.0" y="600.0" class="s" text-anchor="middle">top-1 on the val shards of this batch's font groups</text><path d="M520.0,612 L520.0,634" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="340" y="636" width="360" height="48" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.6"/><text x="520.0" y="664.0" class="t" text-anchor="middle">Improved top-1 by more than 0.002?</text><path d="M340,660 L366,660 L366,704" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><text x="334" y="655" class="l" text-anchor="end">yes</text><path d="M700,660 L690,660 L690,704" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><text x="712" y="655" class="l" text-anchor="start">no</text><rect x="246" y="706" width="240" height="66" rx="8" fill="#e7f5ec" stroke="#2f8f5b" stroke-width="1.6"/><text x="366.0" y="735.0" class="s" text-anchor="middle">save batch_best.pt</text><text x="366.0" y="753.0" class="s" text-anchor="middle">stale = 0</text><rect x="550" y="706" width="270" height="66" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.6"/><text x="685.0" y="735.0" class="s" text-anchor="middle">stale += 1</text><text x="685.0" y="753.0" class="s" text-anchor="middle">stale ≥ 2: LR × 0.3 · stale ≥ 5: stop</text><path d="M366,772 L366,800 L226,800 L226,404 L298,404" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><path d="M690,772 L690,800 L366,800" fill="none" stroke="#52606d" stroke-width="1.6"/><text x="220" y="600" class="l" text-anchor="middle" transform="rotate(-90 220 600)">next epoch</text><path d="M520.0,832 L520.0,870" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><text x="530.0" y="856" class="l" text-anchor="start">after 10 epochs or early stop</text><rect x="300" y="872" width="440" height="72" rx="8" fill="#e7f5ec" stroke="#2f8f5b" stroke-width="1.6"/><text x="520.0" y="894.0" class="t" text-anchor="middle">Finish batch</text><text x="520.0" y="913.0" class="s" text-anchor="middle">reload batch_best.pt → all-fonts top-1 / top-5 on 8 val shards</text><text x="520.0" y="931.0" class="s" text-anchor="middle">write best.pt · last.pt · progress.json</text><rect x="790" y="872" width="230" height="72" rx="8" fill="#e7f5ec" stroke="#2f8f5b" stroke-width="1.6"/><text x="905.0" y="894.0" class="t" text-anchor="middle">runs/font_arcface/</text><text x="905.0" y="913.0" class="m" text-anchor="middle">best.pt · last.pt</text><text x="905.0" y="931.0" class="m" text-anchor="middle">batch_best.pt · progress.json</text><path d="M740,908 L788,908" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><path d="M520.0,944 L520.0,966" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="340" y="968" width="360" height="48" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.6"/><text x="520.0" y="996.0" class="t" text-anchor="middle">More train shards left?</text><path d="M340,992 L60,992 L60,84 L298,84" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><text x="52" y="540" class="l" text-anchor="middle" transform="rotate(-90 52 540)">yes: swap the next ~30 train shards onto Drive, run cell 11 again</text><path d="M520.0,1016 L520.0,1046" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><text x="530.0" y="1036" class="l" text-anchor="start">no</text><rect x="300" y="1048" width="440" height="72" rx="8" fill="#e7f5ec" stroke="#2f8f5b" stroke-width="1.6"/><text x="520.0" y="1070.0" class="t" text-anchor="middle">Build font index  (cell 12)</text><text x="520.0" y="1089.0" class="s" text-anchor="middle">ref glyphs → encoder → mean embedding per font</text><text x="520.0" y="1107.0" class="s" text-anchor="middle">→ font_index.npz  ·  then validate with predict_colab.ipynb</text><rect x="20" y="1151" width="14" height="14" rx="3" fill="#e8f1fb" stroke="#3d7cc9" stroke-width="1.4"/><text x="40" y="1162" class="s" text-anchor="start">data / files</text><rect x="136.4" y="1151" width="14" height="14" rx="3" fill="#ffffff" stroke="#323f4b" stroke-width="1.4"/><text x="156.4" y="1162" class="s" text-anchor="start">script / notebook step</text><rect x="324.8" y="1151" width="14" height="14" rx="3" fill="#f1ecfb" stroke="#7b5cc4" stroke-width="1.4"/><text x="344.8" y="1162" class="s" text-anchor="start">model</text><rect x="390.8" y="1151" width="14" height="14" rx="3" fill="#e7f5ec" stroke="#2f8f5b" stroke-width="1.4"/><text x="410.8" y="1162" class="s" text-anchor="start">saved output</text><rect x="507.20000000000005" y="1151" width="14" height="14" rx="3" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.4"/><text x="527.2" y="1162" class="s" text-anchor="start">decision</text></svg>