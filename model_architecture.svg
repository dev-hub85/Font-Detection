<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1000" viewBox="0 0 1040 1000" role="img" aria-label="FontEncoder + ArcFace model architecture"><title>FontEncoder + ArcFace model architecture</title><style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2933}
.t{font-size:15px;font-weight:600}
.s{font-size:12.5px;fill:#3e4c59}
.m{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#1f2933}
.h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#616e7c}
.l{font-size:12px;fill:#52606d;font-style:italic}
.dim{font-family:Consolas,Menlo,monospace;font-size:12.5px;fill:#7b5cc4;font-weight:600}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs><rect width="1040" height="1000" fill="#ffffff"/><text x="330" y="40" class="h" text-anchor="start">FONTENCODER  ·  11.4 M parameters</text><text x="760" y="40" class="h" text-anchor="start">OUTPUT SHAPE</text><rect x="330" y="56" width="400" height="48" rx="8" fill="#e8f1fb" stroke="#3d7cc9" stroke-width="1.6"/><text x="530.0" y="75.0" class="t" text-anchor="middle">Input glyph</text><text x="530.0" y="94.0" class="s" text-anchor="middle">64×64 grayscale · uint8 → float in [-1, 1]</text><text x="760" y="85.0" class="dim" text-anchor="start">1 × 64 × 64</text><rect x="330" y="122" width="400" height="48" rx="8" fill="#f1ecfb" stroke="#7b5cc4" stroke-width="1.6"/><text x="530.0" y="141.0" class="t" text-anchor="middle">Stem conv 1</text><text x="530.0" y="160.0" class="s" text-anchor="middle">Conv 3×3, 32 ch, stride 1 · BN · ReLU</text><text x="760" y="151.0" class="dim" text-anchor="start">32 × 64 × 64</text><path d="M530,104 L530,120" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="330" y="188" width="400" height="48" rx="8" fill="#f1ecfb" stroke="#7b5cc4" stroke-width="1.6"/><text x="530.0" y="207.0" class="t" text-anchor="middle">Stem conv 2</text><text x="530.0" y="226.0" class="s" text-anchor="middle">Conv 3×3, 64 ch, stride 2 · BN · ReLU</text><text x="760" y="217.0" class="dim" text-anchor="start">64 × 32 × 32</text><path d="M530,170 L530,186" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="330" y="254" width="400" height="48" rx="8" fill="#f1ecfb" stroke="#7b5cc4" stroke-width="1.6"/><text x="530.0" y="273.0" class="t" text-anchor="middle">Stage 1</text><text x="530.0" y="292.0" class="s" text-anchor="middle">2 × ResBlock(64)</text><text x="760" y="283.0" class="dim" text-anchor="start">64 × 32 × 32</text><path d="M530,236 L530,252" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="330" y="320" width="400" height="48" rx="8" fill="#f1ecfb" stroke="#7b5cc4" stroke-width="1.6"/><text x="530.0" y="339.0" class="t" text-anchor="middle">Stage 2</text><text x="530.0" y="358.0" class="s" text-anchor="middle">2 × ResBlock(128), first has stride 2</text><text x="760" y="349.0" class="dim" text-anchor="start">128 × 16 × 16</text><path d="M530,302 L530,318" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="330" y="386" width="400" height="48" rx="8" fill="#f1ecfb" stroke="#7b5cc4" stroke-width="1.6"/><text x="530.0" y="405.0" class="t" text-anchor="middle">Stage 3</text><text x="530.0" y="424.0" class="s" text-anchor="middle">2 × ResBlock(256), first has stride 2</text><text x="760" y="415.0" class="dim" text-anchor="start">256 × 8 × 8</text><path d="M530,368 L530,384" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="330" y="452" width="400" height="48" rx="8" fill="#f1ecfb" stroke="#7b5cc4" stroke-width="1.6"/><text x="530.0" y="471.0" class="t" text-anchor="middle">Stage 4</text><text x="530.0" y="490.0" class="s" text-anchor="middle">2 × ResBlock(512), first has stride 2</text><text x="760" y="481.0" class="dim" text-anchor="start">512 × 4 × 4</text><path d="M530,434 L530,450" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="330" y="518" width="400" height="48" rx="8" fill="#f1ecfb" stroke="#7b5cc4" stroke-width="1.6"/><text x="530.0" y="537.0" class="t" text-anchor="middle">Pooling</text><text x="530.0" y="556.0" class="s" text-anchor="middle">global avg pool ‖ global max pool → concat</text><text x="760" y="547.0" class="dim" text-anchor="start">1024</text><path d="M530,500 L530,516" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="330" y="584" width="400" height="48" rx="8" fill="#f1ecfb" stroke="#7b5cc4" stroke-width="1.6"/><text x="530.0" y="603.0" class="t" text-anchor="middle">Projection</text><text x="530.0" y="622.0" class="s" text-anchor="middle">Dropout 0.1 · Linear 1024 → 256 · BatchNorm1d</text><text x="760" y="613.0" class="dim" text-anchor="start">256</text><path d="M530,566 L530,582" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="330" y="650" width="400" height="48" rx="8" fill="#e7f5ec" stroke="#2f8f5b" stroke-width="1.6"/><text x="530.0" y="669.0" class="t" text-anchor="middle">Font embedding</text><text x="530.0" y="688.0" class="s" text-anchor="middle">L2-normalised (unit length)</text><text x="760" y="679.0" class="dim" text-anchor="start">256</text><path d="M530,632 L530,648" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="16" y="250" width="290" height="360" rx="10" fill="#fbfaff" stroke="#b9a9e3" stroke-width="1.4" stroke-dasharray="6 4"/><text x="161" y="276" class="t" text-anchor="middle">ResBlock(c, stride s)</text><text x="161" y="296" class="s" text-anchor="middle">used ×8 in stages 1–4</text><text x="100" y="324" class="m" text-anchor="middle">x</text><path d="M100,330 L100,348" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="30" y="350" width="140" height="44" rx="6" fill="#f1ecfb" stroke="#7b5cc4" stroke-width="1.6"/><text x="100.0" y="368.0" class="s" text-anchor="middle">Conv 3×3, stride s</text><text x="100.0" y="386.0" class="s" text-anchor="middle">BN · ReLU</text><path d="M100,394 L100,414" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="30" y="416" width="140" height="36" rx="6" fill="#f1ecfb" stroke="#7b5cc4" stroke-width="1.6"/><text x="100.0" y="439.0" class="s" text-anchor="middle">Conv 3×3 · BN</text><path d="M100,452 L100,474" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><circle cx="100" cy="488" r="13" fill="#ffffff" stroke="#7b5cc4" stroke-width="1.6"/><text x="100" y="494" class="t" text-anchor="middle">+</text><path d="M100,501 L100,520" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><rect x="50" y="522" width="100" height="32" rx="6" fill="#f1ecfb" stroke="#7b5cc4" stroke-width="1.6"/><text x="100.0" y="543.0" class="s" text-anchor="middle">ReLU</text><path d="M100,554 L100,580" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><text x="113" y="596" class="m" text-anchor="start">out</text><path d="M100,338 L190,338 L190,488 L115,488" fill="none" stroke="#7b5cc4" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="198" y="396" class="l" text-anchor="start">shortcut:</text><text x="198" y="414" class="l" text-anchor="start">identity, or</text><text x="198" y="430" class="l" text-anchor="start">1×1 conv + BN</text><text x="198" y="446" class="l" text-anchor="start">if the shape</text><text x="198" y="462" class="l" text-anchor="start">changes</text><path d="M530,698 L530,718 L300,718 L300,746" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><path d="M530,718 L920,718 L920,746" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/><text x="110" y="738" class="h" text-anchor="start">TRAINING</text><rect x="110" y="748" width="380" height="200" rx="8" fill="#f1ecfb" stroke="#7b5cc4" stroke-width="1.6"/><text x="300.0" y="798.0" class="t" text-anchor="middle">ArcFace head  ·  2.2 M parameters</text><text x="300.0" y="817.0" class="s" text-anchor="middle">W: 8,600 × 256 — one row per font style</text><text x="300.0" y="835.0" class="s" text-anchor="middle">cos θ = embedding · normalised W</text><text x="300.0" y="853.0" class="s" text-anchor="middle">true font: cos(θ + 0.25)   (angular margin)</text><text x="300.0" y="871.0" class="s" text-anchor="middle">logits × 30   (scale)</text><text x="300.0" y="889.0" class="s" text-anchor="middle">cross-entropy, label smoothing 0.05</text><text x="300.0" y="907.0" class="s" text-anchor="middle">→ AdamW update of encoder + W</text><text x="570" y="738" class="h" text-anchor="start">PREDICTION  (top-k by cosine similarity)</text><rect x="570" y="748" width="380" height="92" rx="8" fill="#ffffff" stroke="#323f4b" stroke-width="1.6"/><text x="760.0" y="780.0" class="t" text-anchor="middle">head</text><text x="760.0" y="799.0" class="s" text-anchor="middle">embedding · normalised W</text><text x="760.0" y="817.0" class="s" text-anchor="middle">(the classifier itself)</text><rect x="570" y="856" width="380" height="92" rx="8" fill="#ffffff" stroke="#323f4b" stroke-width="1.6"/><text x="760.0" y="888.0" class="t" text-anchor="middle">proto</text><text x="760.0" y="907.0" class="s" text-anchor="middle">embedding · font_index.npz prototypes</text><text x="760.0" y="925.0" class="s" text-anchor="middle">prototype = mean embedding of clean ref glyphs</text><rect x="20" y="974" width="14" height="14" rx="3" fill="#e8f1fb" stroke="#3d7cc9" stroke-width="1.4"/><text x="40" y="985" class="s" text-anchor="start">data / files</text><rect x="136.4" y="974" width="14" height="14" rx="3" fill="#ffffff" stroke="#323f4b" stroke-width="1.4"/><text x="156.4" y="985" class="s" text-anchor="start">script / notebook step</text><rect x="324.8" y="974" width="14" height="14" rx="3" fill="#f1ecfb" stroke="#7b5cc4" stroke-width="1.4"/><text x="344.8" y="985" class="s" text-anchor="start">model</text><rect x="390.8" y="974" width="14" height="14" rx="3" fill="#e7f5ec" stroke="#2f8f5b" stroke-width="1.4"/><text x="410.8" y="985" class="s" text-anchor="start">saved output</text></svg>